
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#031512">
  <meta name="robots" content="noindex">
  <title>KRISHAN ADS AGENCY</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 12% 12%, #19e6b455, transparent 30%),
        radial-gradient(circle at 92% 85%, #2f8bff44, transparent 32%),
        linear-gradient(145deg, #031512, #020b12, #04161c);
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 32px 22px;
      text-align: center;
      border: 1px solid #19e6b466;
      border-radius: 28px;
      background: linear-gradient(145deg, #062828e0, #030f14f5);
      box-shadow: 0 20px 70px #0008, 0 0 35px #19e6b422;
      backdrop-filter: blur(20px);
      animation: enter .7s ease;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      padding: 9px 16px;
      margin-bottom: 24px;
      border: 1px solid #19e6b466;
      border-radius: 30px;
      color: #19e6b4;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .logo {
      width: 115px;
      height: 115px;
      margin: auto auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid white;
      outline: 4px solid #19e6b477;
      border-radius: 50%;
      background: #092d2d;
      color: #19e6b4;
      font-size: 55px;
      font-weight: 900;
      box-shadow: 0 0 35px #19e6b477;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      50% { transform: translateY(-7px); }
    }

    h1 {
      margin-bottom: 15px;
      font-size: clamp(25px, 7vw, 32px);
      font-weight: 900;
      background: linear-gradient(90deg, white, #19e6b4, #2f8bff);
      color: transparent;
      background-clip: text;
    }

    .sub {
      margin-bottom: 24px;
      color: #9bc4bf;
      font-size: 14px;
      line-height: 1.7;
    }

    .members {
      display: inline-block;
      margin-bottom: 22px;
      padding: 7px 15px;
      border: 1px solid #19e6b466;
      border-radius: 30px;
      color: #c8fff0;
      font-size: 12px;
      font-weight: bold;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 62px;
      margin-bottom: 15px;
      padding: 16px;
      border: 1px solid #ffffff66;
      border-radius: 17px;
      color: #02130f;
      background: linear-gradient(105deg, #19e6b4, #2f8bff);
      font-size: 16px;
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 10px 30px #19e6b444;
      transition: .25s;
    }

    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 35px #19e6b466;
    }

    .whatsapp {
      color: white;
      background: linear-gradient(105deg, #128c48, #20c875);
      box-shadow: 0 10px 30px #20c87544;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-top: 22px;
    }

    .feature {
      padding: 14px 4px;
      border: 1px solid #19e6b455;
      border-radius: 14px;
      background: #ffffff0a;
    }

    .feature b {
      display: block;
      margin-bottom: 5px;
      color: #19e6b4;
      font-size: 14px;
    }

    .feature span {
      color: #9bc4bf;
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .footer {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #19e6b455;
      color: #7aa6a2;
      font-size: 11px;
      line-height: 1.7;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="badge">⚡ KRISHAN ADS AGENCY ⚡</div>

    <div class="logo">K</div>

    <h1>KRISHAN ADS AGENCY</h1>

    <p class="sub">
      Welcome to Krishan Ads Agency.
      Join our Telegram channel and connect with us on WhatsApp.
    </p>

    <div class="members">WELCOME TO OUR COMMUNITY</div>

    <a class="btn"
       href="https://t.me/+g-21jaJ2VTQ0NDk1"
       target="_blank"
       rel="noopener noreferrer">
      ✈ JOIN TELEGRAM CHANNEL
    </a>

    <a class="btn whatsapp"
       href="https://walink.me/rkj7qf"
       target="_blank"
       rel="noopener noreferrer">
      ☎ WHATSAPP AD
    </a>

    <div class="features">
      <div class="feature">
        <b>ADS</b>
        <span>SERVICES</span>
      </div>
      <div class="feature">
        <b>INSTANT</b>
        <span>SUPPORT</span>
      </div>
      <div class="feature">
        <b>24/7</b>
        <span>CONNECT</span>
      </div>
    </div>

    <div class="footer">
      Opens Telegram or WhatsApp<br>
      © KRISHAN ADS AGENCY
    </div>

  </main>
</body>
</html>
